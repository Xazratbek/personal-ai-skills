[project]
name = "phone-mcp"
version = "1.0.0"
description = "Drive local iOS simulators, Android emulators and Android phones from any MCP client, free"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.3,<3",
    "pillow>=10",
]

[project.scripts]
phone-mcp = "phone_mcp.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phone_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
